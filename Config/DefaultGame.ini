[/Script/UnrealEd.ProjectPackagingSettings]
; The map the game ships with. Every way of packaging cooks the same set, so a build from the
; editor's Package button and one from the command line come out alike.
+MapsToCook=(FilePath="/Game/RoundSurvival/Maps/L_RS_Main")
; The gameplay cue manager finds its notifies by scanning GameplayCueNotifyPaths at runtime, and
; nothing references them directly, so a cook by map leaves them out. Cooking the same folder it
; scans keeps the two in step by construction.
+DirectoriesToAlwaysCook=(Path="/Game/RoundSurvival")
; Test maps stay out of the game.
+DirectoriesToNeverCook=(Path="/Game/RoundSurvival/Maps/Dev")

